name: security-scan

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    name: gitleaks + PowerShell syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ""
        with:
          gitleaks: "detect --source . --no-banner --redact"

      - name: Validate PowerShell syntax (pwsh parser)
        # pwsh is preinstalled on ubuntu-latest runner images; no setup action needed.
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Error ("Syntax error in {0}: {1}" -f $_.FullName, ($errors[0].Message))
            }
          }
          if ($failed) { exit 1 }
          Write-Host "All .ps1 files parsed successfully."

  osv-scan:
    name: osv-scanner (dependency vulnerabilities)
    # Google's recommended reusable workflow (the raw docker action is
    # "not intended to be used directly" and may change behavior in minor
    # patch updates). It declares its own permissions, including
    # security-events: write for the SARIF upload to Code Scanning.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        -r
        ./
